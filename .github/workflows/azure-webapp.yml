name: Deploy to Azure VM - talentree-ai-service

on:
  push:
    branches:
      - feature/bo-dashboard
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: 'http://20.244.32.232:8000'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e

            REPO_DIR="/home/${{ secrets.VM_USER }}/talentree-ai"

            # Clone repo if it doesn't exist yet
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo ">>> Repo not found — cloning..."
              git clone -b feature/bo-dashboard https://github.com/Talentree-Platform/AI_Repo.git "$REPO_DIR"
            fi

            # Pull latest code
            cd "$REPO_DIR"
            git fetch origin feature/bo-dashboard
            git reset --hard origin/feature/bo-dashboard

            # Create virtualenv if missing
            if [ ! -d "venv" ]; then
              echo ">>> venv not found — creating..."
              python3 -m venv venv
            fi

            # Install/update dependencies
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            # Restart service (graceful — won't fail if not registered)
            if sudo systemctl is-enabled talentree-ai 2>/dev/null; then
              sudo systemctl restart talentree-ai
              echo "✅ Service restarted"
            else
              echo "⚠️ systemd service not registered — killing old process and restarting..."
              pkill -f "uvicorn main:app" || true
              nohup venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/talentree-ai.log 2>&1 &
              echo "✅ App started on port 8000"
            fi

            echo "✅ Deployment complete — http://20.244.32.232:8000"

name: Deploy to Azure VM - talentree-ai-service

on:
  push:
    branches:
      - feature/bo-dashboard
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: 'http://20.244.32.232:8000'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -e

            # Pull latest code
            cd /home/${{ secrets.VM_USER }}/talentree-ai
            git fetch origin feature/bo-dashboard
            git reset --hard origin/feature/bo-dashboard

            # Install/update dependencies
            source venv/bin/activate
            pip install -r requirements.txt --quiet

            # Restart the service
            sudo systemctl restart talentree-ai
            echo "✅ Deployment complete — http://20.244.32.232:8000"

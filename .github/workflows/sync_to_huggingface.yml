name: Sync to Hugging Face Spaces

on:
  push:
    branches: [multiagent-system]
  # Allows manual runs from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global credential.helper store
          echo "https://mona38:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
          git push --force https://huggingface.co/spaces/mona38/Talentree-MultiAgent HEAD:refs/heads/main
          rm -f ~/.git-credentials

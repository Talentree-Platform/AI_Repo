name: Sync to Hugging Face Spaces

on:
  push:
    branches: [multiagent-system]
  # Allows manual runs from GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://mona38:$HF_TOKEN@huggingface.co/spaces/mona38/Talentree-MultiAgent HEAD:refs/heads/main
